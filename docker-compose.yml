version: '3.8'

services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: contacts_portal
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./contacts-api
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: mysql://root:password@db:3306/contacts_portal
      JWT_SECRET: your-long-random-secret-here
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./contacts-web
      dockerfile: Dockerfile
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  db_data: